
name: Adana Halay - Otomatik APK Derleme

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adana-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: En Güncel ZIP Dosyasından APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: En güncel ZIP dosyasını bul ve aç
        id: source
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import zipfile
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          excluded = {".git", "node_modules", "build", "android"}
          archives = []

          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() != ".zip":
                  continue
              if any(part in excluded for part in p.relative_to(root).parts):
                  continue

              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", str(p.relative_to(root))],
                  capture_output=True, text=True
              )

              timestamp = int(result.stdout.strip() or 0)
              archives.append((timestamp, p))

          if not archives:
              raise SystemExit("HATA: Depoda ZIP dosyası bulunamadı!")

          archives.sort(key=lambda x: x[0], reverse=True)
          selected = archives[0][1]

          print("Seçilen ZIP:", selected)

          destination = Path(os.environ["RUNNER_TEMP"]) / "adana-source"
          destination.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(selected) as z:
              for info in z.infolist():
                  target = (destination / info.filename).resolve()
                  if os.path.commonpath([str(destination.resolve()), str(target)]) != str(destination.resolve()):
                      raise SystemExit("Güvenli olmayan ZIP dosya yolu!")
              z.extractall(destination)

          manifests = [
              p for p in destination.rglob("package.json")
              if "node_modules" not in p.parts
          ]

          if not manifests:
              raise SystemExit("HATA: ZIP içerisinde package.json bulunamadı!")

          manifests.sort(key=lambda p: (len(p.relative_to(destination).parts), str(p)))
          project = manifests[0].parent

          required = [
              "package.json",
              "capacitor.config.json",
              "www/index.html",
              "scripts/copy-three.js"
          ]

          for item in required:
              if not (project / item).is_file():
                  raise SystemExit(f"Eksik proje dosyası: {item}")

          print("Proje klasörü:", project)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project}\n")
              f.write(f"ZIP_NAME={selected.name}\n")
          PY

      - name: Seçilen projeyi göster
        run: |
          echo "Seçilen ZIP: $ZIP_NAME"
          echo "Proje klasörü: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: NPM bağımlılıklarını kur
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Three.js dosyasını hazırla
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run prepare-www
          test -f www/three.min.js

      - name: Android projesini oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: APK sürümünü ayarla
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("build.gradle bulunamadı!")

          s = p.read_text()

          s, a = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+',
              lambda m: m.group(1) + os.environ["BUILD_NUMBER"],
              s, count=1
          )

          s, b = re.subn(
              r'(?m)^(\s*versionName\s+)["\'][^"\']*["\']',
              lambda m: m.group(1) + '"2.0.' + os.environ["BUILD_NUMBER"] + '"',
              s, count=1
          )

          if a != 1 or b != 1:
              raise SystemExit("Sürüm bilgileri ayarlanamadı!")

          p.write_text(s)
          PY

      - name: Android APK derle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını hazırla
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          mkdir -p output
          cp "$APK" output/adana-halay-dugunu.apk

          ls -lh output/adana-halay-dugunu.apk

      - name: APK indirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: adana-halay-dugunu-apk
          path: ${{ env.PROJECT_DIR }}/output/adana-halay-dugunu.apk
          if-no-files-found: error
          retention-days: 30

      - name: Latest etiketini güncelle
        run: |
          git tag -f latest
          git push -f origin latest

      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Adana Halay - En Güncel APK
          body: |
            Otomatik ZIP kaynaklı Android APK.

            Kaynak ZIP: ${{ env.ZIP_NAME }}
            Derleme: #${{ github.run_number }}
            Sürüm: 2.0.${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/output/adana-halay-dugunu.apk
          make_latest: true
          fail_on_unmatched_files: true
